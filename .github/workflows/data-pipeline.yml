name: Data Pipeline

on:
  schedule:
    # AFSA publishes personal insolvency statistics QUARTERLY, roughly a month
    # after each quarter ends, so this runs quarterly to match — one month into
    # each new quarter. Staggered to day 9 at 04:23 UTC so it does not fire
    # alongside the rest of the fleet.
    - cron: '23 4 9 2,5,8,11 *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['pipeline/**']

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    # afsa.gov.au's WAF tarpits datacenter IPs, so this job can fail with
    # ETIMEDOUT even though the same script succeeds from a normal connection.
    # That is survivable: the site serves only the committed files in
    # public/data/, so a failed refresh leaves the data one quarter stale rather
    # than breaking production. If it fails, run the pipeline locally and commit.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # `npm install`, not `npm ci`: the pipeline has no committed lockfile and
      # mapshaper's dependency tree resolves differently on CI.
      - run: cd pipeline && npm install --no-audit --no-fund
      - run: node pipeline/collect.mjs
      - run: node pipeline/aggregate.mjs
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/
          git diff --cached --quiet || git commit -m "Update data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push || (git pull --rebase && git push)
